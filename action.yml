name: 'yaml-workflow'
description: 'Run yaml-workflow pipelines in GitHub Actions'
branding:
  icon: 'play-circle'
  color: 'blue'

inputs:
  workflow:
    description: 'Path to workflow YAML file'
    required: true
  params:
    description: 'Parameters as name=value pairs (one per line)'
    required: false
    default: ''
  format:
    description: 'Output format (text, json, yaml)'
    required: false
    default: 'text'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  version:
    description: 'yaml-workflow version to install (e.g. 0.8.0). Empty = latest.'
    required: false
    default: ''

outputs:
  result:
    description: 'Workflow output (structured when format is json/yaml)'
    value: ${{ steps.run.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install yaml-workflow
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          python -m pip install "yaml-workflow==$INPUT_VERSION"
        elif [ -f "$ACTION_PATH/pyproject.toml" ]; then
          python -m pip install "$ACTION_PATH"
        else
          python -m pip install yaml-workflow
        fi

    - name: Run workflow
      id: run
      shell: bash
      env:
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_PARAMS: ${{ inputs.params }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        PARAMS=()
        if [ -n "$INPUT_PARAMS" ]; then
          while IFS= read -r line; do
            line="${line%$'\r'}"                       # strip trailing CR (Windows CRLF)
            [ -n "${line//[[:space:]]/}" ] && PARAMS+=("$line")  # skip blank/whitespace-only lines
          done <<< "$INPUT_PARAMS"
        fi

        OUTPUT=$(yaml-workflow run "$INPUT_WORKFLOW" "${PARAMS[@]}" --format "$INPUT_FORMAT" 2>/tmp/yaml-workflow-stderr.log)
        if [ -s /tmp/yaml-workflow-stderr.log ]; then
          echo "::debug::$(cat /tmp/yaml-workflow-stderr.log)"
        fi

        # Use heredoc for multi-line output
        {
          echo "result<<YAML_WORKFLOW_EOF"
          echo "$OUTPUT"
          echo "YAML_WORKFLOW_EOF"
        } >> "$GITHUB_OUTPUT"

        echo "$OUTPUT"
