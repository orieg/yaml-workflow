name: CI Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['main']

permissions:
  contents: read
  pull-requests: read # merged-pr-body reads the merged PR's description on push

jobs:
  discipline:
    name: Discipline Sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge base must be reachable
      - uses: orieg/discipline@1c8ea1b2d5e0b90d17779060ff93154c2e2f46a3 # v0.19.0
        with:
          version: v0.14.4
          fail_on_warnings: true
          # Judge a change by the base branch's discipline.toml, so a policy edit
          # takes effect only once merged (config-integrity still reports it).
          policy_from: base
          # Overrides come from the PR description; on a push to main, from the
          # body of the merged pull request (squash merges drop it from the commit).
          directive_sources: pr-body,merged-pr-body

