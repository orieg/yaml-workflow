# discipline.toml — CI/CD gatekeeper and AI coding agent diff sentinel configuration.
#
# Every available gate is on at severity "error" by default.
# Reference: https://github.com/orieg/discipline/blob/main/docs/CONFIGURATION.md

[meta]
version = 1
name = "yaml-workflow"
description = "Lightweight Python workflow engine with YAML and Jinja2"

[gates.pii]
allowed_users = ["runner", "user", "username", "you", "me", "name", "example", "shared", "test"]

[gates.version-lockstep]
enabled = true
groups = [
  { name = "project-version", sources = [
    { path = "pyproject.toml", regex = 'version = "([^"]+)"' },
    { path = "server.json", regex = '(?m)^\s{2}"version":\s*"([^"]+)"' },
    { path = "server.json", regex = '"identifier":\s*"yaml-workflow",\s*"version":\s*"([^"]+)"' }
  ]}
]

[gates.vacuous-tests]
# jsonschema.validate raises on invalid data; pytest-benchmark's fixture fails on an error.
assert_helper_fns = ["jsonschema.validate", "benchmark"]

